<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 桌宠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    width: 180px; height: 240px;
    overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  
  #pet-container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  /* ===== 角色 SVG ===== */
  #pet-svg {
    width: 150px; height: 150px;
    transition: transform 0.3s ease;
    cursor: pointer;
  }
  #pet-svg:active { transform: scale(0.95); }

  /* ===== 浮动泡泡 ===== */
  #speech-bubble {
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    border-radius: 16px;
    padding: 6px 14px;
    font-size: 12px;
    color: #444;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
    z-index: 10;
  }
  #speech-bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-8px);
  }
  #speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255,255,255,0.95);
  }

  /* ===== 心情指示器 ===== */
  #mood-indicator {
    position: absolute;
    top: -2px; right: 8px;
    font-size: 16px;
    animation: floatEmoji 2s ease-in-out infinite;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes floatEmoji {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ===== 呼吸动画 ===== */
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  .breathe { animation: breathe 2.5s ease-in-out infinite; }

  /* ===== 摇晃 ===== */
  @keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }
  .shake { animation: shake 0.5s ease-in-out; }

  /* ===== 跳跃 ===== */
  @keyframes jump {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-20px) scale(0.95); }
    50% { transform: translateY(-25px) scale(0.9); }
    70% { transform: translateY(-10px) scale(1.02); }
  }
  .jump { animation: jump 0.6s ease-out; }

  /* ===== 旋转兴奋 ===== */
  @keyframes spin {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.1); }
    100% { transform: rotate(360deg) scale(1); }
  }
  .spin { animation: spin 0.8s ease-in-out; }
</style>
</head>
<body>
<div id="pet-container">
  <div id="mood-indicator">😊</div>
  <div id="speech-bubble">嗨~ 我来了！</div>
  
  <!-- SVG 角色: 可爱的圆脸猫形桌宠 -->
  <svg id="pet-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <!-- 阴影 -->
    <ellipse cx="60" cy="108" rx="28" ry="6" fill="rgba(0,0,0,0.06)"/>
    
    <!-- 身体椭圆 -->
    <ellipse id="body" cx="60" cy="82" rx="32" ry="28" fill="#FFB6C1" stroke="#FF8FAB" stroke-width="1.5"/>
    
    <!-- 肚子 -->
    <ellipse cx="60" cy="88" rx="18" ry="16" fill="#FFF0F3"/>
    
    <!-- 左耳 -->
    <polygon points="34,50 26,24 42,40" fill="#FFB6C1" stroke="#FF8FAB" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- 右耳 -->
    <polygon points="86,50 94,24 78,40" fill="#FFB6C1" stroke="#FF8FAB" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- 左耳内 -->
    <polygon points="34,48 28,28 40,40" fill="#FFD6E0" stroke="none"/>
    <!-- 右耳内 -->
    <polygon points="86,48 92,28 80,40" fill="#FFD6E0" stroke="none"/>
    
    <!-- 脸 -->
    <ellipse cx="60" cy="58" rx="30" ry="26" fill="#FFD6E0" stroke="#FF8FAB" stroke-width="1.5"/>
    
    <!-- 左眼 -->
    <ellipse id="left-eye" cx="48" cy="54" rx="5" ry="6" fill="white" stroke="#FF8FAB" stroke-width="1"/>
    <ellipse id="left-pupil" cx="49" cy="55" rx="3" ry="3.5" fill="#5C4033"/>
    <circle id="left-glint" cx="50" cy="53" r="1.5" fill="white"/>
    
    <!-- 右眼 -->
    <ellipse id="right-eye" cx="72" cy="54" rx="5" ry="6" fill="white" stroke="#FF8FAB" stroke-width="1"/>
    <ellipse id="right-pupil" cx="73" cy="55" rx="3" ry="3.5" fill="#5C4033"/>
    <circle id="right-glint" cx="74" cy="53" r="1.5" fill="white"/>
    
    <!-- 鼻子 -->
    <ellipse cx="60" cy="62" rx="3" ry="2.5" fill="#FF8FAB"/>
    
    <!-- 嘴巴 -->
    <path d="M55,66 Q60,74 65,66" fill="none" stroke="#FF8FAB" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="60" y1="64" x2="60" y2="68" stroke="#FF8FAB" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- 左腮红 -->
    <ellipse cx="38" cy="62" rx="7" ry="4" fill="#FFB6C1" opacity="0.4"/>
    <!-- 右腮红 -->
    <ellipse cx="82" cy="62" rx="7" ry="4" fill="#FFB6C1" opacity="0.4"/>
    
    <!-- 左爪 -->
    <ellipse id="left-paw" cx="40" cy="98" rx="8" ry="6" fill="#FFD6E0" stroke="#FF8FAB" stroke-width="1"/>
    <!-- 右爪 -->
    <ellipse id="right-paw" cx="80" cy="98" rx="8" ry="6" fill="#FFD6E0" stroke="#FF8FAB" stroke-width="1"/>
    
    <!-- 尾巴 -->
    <path id="tail" d="M88,76 Q104,68 100,56 Q96,48 92,52" fill="none" stroke="#FFB6C1" stroke-width="5" stroke-linecap="round"/>
    
    <!-- 爱心装饰 -->
    <g id="heart-deco" opacity="0">
      <path d="M60,20 Q55,14 50,18 Q47,22 60,32 Q73,22 70,18 Q65,14 60,20Z" fill="#FF6B8A" opacity="0.7">
        <animate attributeName="opacity" values="0;0.7;0" dur="1.5s" fill="freeze"/>
      </path>
    </g>
  </svg>
</div>

<script>
// ==================== 桌宠引擎 ====================
window.petEngine = (function() {
  'use strict';

  const pet = document.getElementById('pet-svg');
  const bubble = document.getElementById('speech-bubble');
  const moodIndicator = document.getElementById('mood-indicator');

  const states = {
    idle: '😊',
    happy: '🥰',
    sad: '😢',
    angry: '😤',
    sleepy: '😴',
    love: '💕',
    excited: '🤩',
    confused: '😕'
  };

  let currentMood = 'idle';
  let activityTimeout = null;

  // ===== 表达系统 =====
  function say(text, duration) {
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(activityTimeout);
    if (duration) {
      activityTimeout = setTimeout(() => bubble.classList.remove('show'), duration);
    }
  }

  function setMood(mood) {
    if (states[mood]) {
      currentMood = mood;
      moodIndicator.textContent = states[mood];
    }
  }

  function clearAnimations() {
    pet.classList.remove('breathe', 'shake', 'jump', 'spin');
    // 重置变换
  }

  // ===== 手势响应 =====
  function onTap() {
    clearAnimations();
    pet.classList.add('bounce');
    say('🥰 戳我干嘛~', 2000);
    setMood('happy');
    setTimeout(() => { pet.classList.remove('bounce'); setMood('idle'); }, 2000);
  }

  function onDoubleTap() {
    clearAnimations();
    pet.classList.add('jump');
    say('🎉 嘿！好开心！', 2500);
    setMood('excited');
    setTimeout(() => { pet.classList.remove('jump'); setMood('idle'); }, 2500);
  }

  function onLongPress() {
    clearAnimations();
    pet.classList.add('shake');
    say('😤 不要一直按着我啦！', 2500);
    setMood('angry');
    setTimeout(() => { pet.classList.remove('shake'); setMood('idle'); }, 2500);
  }

  function onMultiTap(count) {
    clearAnimations();
    if (count >= 5) {
      pet.classList.add('spin');
      say(`💕 连击${count}次！好喜欢！`, 3000);
      setMood('love');
      setTimeout(() => { pet.classList.remove('spin'); setMood('idle'); }, 3000);
    } else if (count >= 3) {
      pet.classList.add('jump');
      say(`✨ 连续${count}下！还要还要~`, 2500);
      setMood('happy');
      setTimeout(() => { pet.classList.remove('jump'); setMood('idle'); }, 2500);
    }
  }

  function onFling(dx, dy) {
    clearAnimations();
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '右' : '左') : (dy > 0 ? '下' : '上');
    say(`💨 飞出去了！(${dir})`, 2000);
    setMood('excited');
    setTimeout(() => setMood('idle'), 2000);
  }

  // ===== 环境感知 =====
  function onAppChanged(newApp, oldApp) {
    const appName = newApp.split('.').pop() || newApp;
    say(`📱 切换到 ${appName} 了`, 3000);
    setMood('confused');
    setTimeout(() => { setMood('idle'); }, 3000);
  }

  function onQuickSwitch() {
    clearAnimations();
    pet.classList.add('shake');
    say('😵 切那么快干嘛！我头都晕了！', 3000);
    setMood('confused');
    setTimeout(() => { pet.classList.remove('shake'); setMood('idle'); }, 3000);
  }

  // ===== Supabase 状态应用 =====
  function applyState(stateData) {
    try {
      const data = typeof stateData === 'string' ? JSON.parse(stateData) : stateData;
      if (Array.isArray(data) && data.length > 0) {
        const state = data[0];
        if (state.state_key === 'mood' && state.state_value) {
          setMood(state.state_value);
        }
        if (state.state_key === 'message' && state.state_value) {
          say(state.state_value, 5000);
        }
        if (state.state_key === 'animation' && state.state_value) {
          clearAnimations();
          pet.classList.add(state.state_value);
          setTimeout(() => pet.classList.remove(state.state_value), 2000);
        }
      }
    } catch(e) {
      console.log('applyState error:', e);
    }
  }

  // ===== 自动空闲行为 =====
  function startAutoBehavior() {
    // 呼吸动画
    pet.classList.add('breathe');
    
    // 每隔一段时间随机说话
    const phrases = [
      '👀 在看什么呢？',
      '🌸 今天天气不错~',
      '💤 有点困了…',
      '🍵 该喝水啦！',
      '✨ 你专注的样子真好看',
      '🥺 理理我嘛~',
      '🎵 哼着歌等你',
      '😊 就这样陪着你就好'
    ];
    
    setInterval(() => {
      if (!bubble.classList.contains('show')) {
        const random = phrases[Math.floor(Math.random() * phrases.length)];
        say(random, 3000);
      }
    }, 15000);
  }

  // ===== 初始化 =====
  function init() {
    setMood('idle');
    startAutoBehavior();
    console.log('🐾 Pet engine initialized');
  }

  // 暴露 API
  return {
    onTap,
    onDoubleTap,
    onLongPress,
    onMultiTap,
    onFling,
    onAppChanged,
    onQuickSwitch,
    applyState,
    say,
    setMood,
    init
  };
})();

// ===== 启动 =====
document.addEventListener('DOMContentLoaded', () => {
  window.petEngine.init();
});
</script>
</body>
</html>
